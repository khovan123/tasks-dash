services:
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api

    environment:
      INTERNAL_API_BASE_URL: http://backend:4000/api

    restart: unless-stopped

    ports:
      - "127.0.0.1:3100:3000"

    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:4100:4000"

    env_file:
      - /etc/fogewise/apps/${APP_NAME}.env

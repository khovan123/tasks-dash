services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - tasks_dash_mongo:/data/db
  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    depends_on: [mongodb]
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
volumes:
  tasks_dash_mongo:

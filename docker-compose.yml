services:
  frontend:
    build:
      context: ./apps/api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"

  backend:
    build:
      context: ./apps/web
    restart: unless-stopped
    ports:
      - "127.0.0.1:4100:4000"

    env_file:
      - /etc/fogewise/apps/task-dash.env
